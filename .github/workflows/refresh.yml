name: Refresh news feed

on:
  # 5-minute backend refresh cadence, self-contained in this workflow.
  #
  # Primary trigger: GitHub's schedule (cron) set to every 5 minutes.
  # This makes the repo publish fresh headlines.json + stocks.json ~every 5 min
  # when the scheduled run actually executes.
  #
  # Important: GitHub scheduled workflows are best-effort. On the free tier they
  # can occasionally be delayed (sometimes 10-30+ min). For a news ticker this is
  # usually acceptable.
  #
  # Additional triggers supported:
  # - workflow_dispatch: manual runs from the GitHub UI (Actions tab) or CLI,
  #   and optional external callers if you ever want stricter timing later.
  #
  # The concurrency group prevents overlapping runs.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: news-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Fetch news
        run: python scan/fetch_news.py

      - name: Fetch stock prices for tagged tickers
        run: python scan/fetch_stocks.py
        continue-on-error: true

      - name: Commit and push
        run: |
          git config user.name "numichart-news-bot"
          git config user.email "bot@numichart-news"
          git add docs/data/headlines.json docs/data/stocks.json
          git diff --cached --quiet && echo "No new headlines" || \
            git commit -m "chore: refresh feed $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main || true
          git push || true
